name: Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true
      skip_docker:
        description: 'Skip Docker image build (use when images already exist)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: ./.github/actions/test

  build-frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Extract version info for frontend
        id: frontend-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#v}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      - name: Build frontend
        working-directory: frontend
        env:
          npm_package_version: ${{ steps.frontend-version.outputs.version }}
          GIT_COMMIT: ${{ steps.frontend-version.outputs.commit }}
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 1

  prepare-release:
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Extract version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#v}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi
          COMMIT=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Package source snapshot
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="${RUNNER_TEMP}/tater-tube-source.tar.gz" HEAD
          tar -tzf "${RUNNER_TEMP}/tater-tube-source.tar.gz" >/dev/null

      - name: Upload source snapshot
        uses: actions/upload-artifact@v6
        with:
          name: source-snapshot
          path: ${{ runner.temp }}/tater-tube-source.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.release_tag }}
          GENERATE_NOTES: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            fi
          else
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$TAG" --title "Tater Tube Server $TAG" --notes-file "$NOTES_FILE"
            elif [ "$GENERATE_NOTES" = "true" ]; then
              gh release create "$TAG" --title "Tater Tube Server $TAG" --generate-notes
            else
              gh release create "$TAG" --title "Tater Tube Server $TAG"
            fi
          fi

  build-image:
    name: Build Docker Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [prepare-release, build-frontend]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_docker }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/dist/

      - name: Normalize image name
        run: |
          echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker login (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile.ci
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Tater Tube Server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare-release.outputs.version }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          provenance: false
          sbom: false
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=${{ needs.prepare-release.outputs.version }}
            COMMIT=${{ needs.prepare-release.outputs.commit }}

      - name: Export image digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v6
        with:
          name: image-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: build-image
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_docker }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Normalize image name
        run: |
          echo "IMAGE_NAME_LC=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker login (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest multi-arch tag
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}"
          refs=()
          for digest_file in /tmp/digests/*; do
            digest="$(basename "$digest_file")"
            refs+=("${image}@sha256:${digest}")
          done
          printf 'Publishing %s:latest from digests:\n' "$image"
          printf '  %s\n' "${refs[@]}"
          docker buildx imagetools create -t "${image}:latest" "${refs[@]}"

  build-macos-app:
    name: Build macOS App
    runs-on: [self-hosted, macOS, tater-tube-server]
    needs: [prepare-release, build-frontend]
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      TATER_TUBE_VERSION: ${{ needs.prepare-release.outputs.version }}
      TATER_TUBE_BUILD: ${{ github.run_number }}
      TATER_TUBE_COMMIT: ${{ needs.prepare-release.outputs.commit }}
      TATER_CODESIGN_IDENTITY: "${{ vars.TATER_CODESIGN_IDENTITY || 'Developer ID Application: Tater Totterson AI LLC (8BHV7Y2D9D)' }}"
      TATER_NOTARIZE: "${{ vars.TATER_NOTARIZE || '1' }}"
      TATER_NOTARY_PROFILE: "${{ vars.TATER_NOTARY_PROFILE || 'tater-notary' }}"

    steps:
      - name: Prepare runner workspace
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"
          repo_name="${GITHUB_REPOSITORY##*/}"
          expected_suffix="/_work/${repo_name}/${repo_name}"
          if [[ "${workspace}" != *"${expected_suffix}" ]]; then
            echo "::error::Refusing to clean unexpected runner workspace: ${workspace}"
            exit 1
          fi
          find "${workspace}" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

      - name: Download source snapshot
        uses: actions/download-artifact@v8
        with:
          name: source-snapshot
          path: ${{ runner.temp }}/tater-tube-source

      - name: Extract source snapshot
        shell: bash
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE:?GITHUB_WORKSPACE is required}"
          archive="${RUNNER_TEMP:?RUNNER_TEMP is required}/tater-tube-source/tater-tube-source.tar.gz"
          test -f "${archive}"
          tar -xzf "${archive}" -C "${workspace}"
          rm -rf -- "${RUNNER_TEMP}/tater-tube-source"
          test -f "${workspace}/go.mod"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.0

      - name: Download frontend build
        uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: frontend/dist/

      - name: Configure bundled FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg_prefix="$(brew --prefix ffmpeg-full 2>/dev/null || true)"
          if [[ ! -x "${ffmpeg_prefix}/bin/ffmpeg" || ! -x "${ffmpeg_prefix}/bin/ffprobe" ]]; then
            # This is a persistent self-hosted runner. Install only when the
            # required keg is absent so a release cannot disturb a working
            # FFmpeg toolchain. --overwrite lets Homebrew repair stale links
            # left by earlier formula revisions on this persistent runner.
            if ! HOMEBREW_NO_AUTO_UPDATE=1 brew install --overwrite ffmpeg-full; then
              echo "Initial ffmpeg-full install failed; retrying once."
              HOMEBREW_NO_AUTO_UPDATE=1 brew install --overwrite ffmpeg-full
            fi
            ffmpeg_prefix="$(brew --prefix ffmpeg-full)"
          fi
          if ! brew list --versions molten-vk >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install molten-vk
          fi
          moltenvk_prefix="$(brew --prefix molten-vk)"
          echo "${ffmpeg_prefix}/bin" >> "${GITHUB_PATH}"
          echo "TATER_FFMPEG_PATH=${ffmpeg_prefix}/bin/ffmpeg" >> "${GITHUB_ENV}"
          echo "TATER_FFPROBE_PATH=${ffmpeg_prefix}/bin/ffprobe" >> "${GITHUB_ENV}"
          echo "TATER_MOLTENVK_PREFIX=${moltenvk_prefix}" >> "${GITHUB_ENV}"
          test -x "${ffmpeg_prefix}/bin/ffmpeg"
          test -x "${ffmpeg_prefix}/bin/ffprobe"
          test -f "${moltenvk_prefix}/lib/libMoltenVK.dylib"
          test -f "${moltenvk_prefix}/etc/vulkan/icd.d/MoltenVK_icd.json"

      - name: Build signed updater package
        shell: bash
        run: macos/TaterTubeServer/scripts/package_update.sh

      - name: Build signed installer DMG
        shell: bash
        run: macos/TaterTubeServer/scripts/build_dmg.sh

      - name: Verify release artifacts
        id: macos-meta
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          zip_path="macos/TaterTubeServer/releases/Tater-Tube-Server-${RELEASE_TAG}.zip"
          dmg_path="macos/TaterTubeServer/releases/Tater-Tube-Server-${RELEASE_TAG}.dmg"
          manifest_path="macos/TaterTubeServer/update-manifest.json"
          test -f "${zip_path}"
          test -f "${dmg_path}"
          test -f "${manifest_path}"
          codesign --verify --deep --strict --verbose=2 "macos/TaterTubeServer/build/Tater Tube Server.app"
          shasum -a 256 "${zip_path}" "${dmg_path}" "${manifest_path}"
          echo "zip_path=${zip_path}" >> "${GITHUB_OUTPUT}"
          echo "dmg_path=${dmg_path}" >> "${GITHUB_OUTPUT}"
          echo "manifest_path=${manifest_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Tater-Tube-Server-macOS-${{ needs.prepare-release.outputs.release_tag }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
          path: |
            ${{ steps.macos-meta.outputs.zip_path }}
            ${{ steps.macos-meta.outputs.dmg_path }}
            ${{ steps.macos-meta.outputs.manifest_path }}

      - name: Publish macOS release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            "${{ steps.macos-meta.outputs.zip_path }}" \
            "${{ steps.macos-meta.outputs.dmg_path }}" \
            "${{ steps.macos-meta.outputs.manifest_path }}" \
            --clobber

      - name: Commit updater manifest to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${GITHUB_SHA}" != "${current_main}" ]]; then
            echo "Release commit is not current origin/main; skipping updater manifest commit."
            exit 0
          fi

          manifest_path="macos/TaterTubeServer/update-manifest.json"
          contents_endpoint="repos/${GITHUB_REPOSITORY}/contents/${manifest_path}"
          remote_sha="$(gh api "${contents_endpoint}?ref=main" --jq '.sha')"
          local_sha="$(/usr/bin/git hash-object "${manifest_path}")"
          if [[ "${local_sha}" == "${remote_sha}" ]]; then
            echo "Updater manifest is already current."
            exit 0
          fi

          encoded_manifest="$(/usr/bin/base64 < "${manifest_path}" | tr -d '\n')"
          for attempt in 1 2 3; do
            if gh api --method PUT "${contents_endpoint}" \
              --field message="Update macOS release manifest for ${RELEASE_TAG}" \
              --field content="${encoded_manifest}" \
              --field sha="${remote_sha}" \
              --field branch=main >/dev/null; then
              exit 0
            fi
            echo "Manifest update failed on attempt ${attempt}; retrying..." >&2
            sleep 10
          done
          echo "::warning::The macOS artifacts were published, but the updater manifest could not be updated on main."
